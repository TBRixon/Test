<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RefiSight — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:   #0d1b2e;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --muted:  #64748b;
      --text:   #0f172a;
      --red:    #ef4444;
    }
    html, body {
      height: 100%;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--navy);
      color: var(--text);
      font-size: 14px;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 44px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .brand-icon {
      width: 38px; height: 38px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 20px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -.4px;
    }
    .brand-tagline {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #991b1b;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background: #f8fafc;
      outline: none;
      transition: border-color .15s, background .15s;
    }
    input:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--muted);
    }
    .remember-row input[type="checkbox"] { accent-color: var(--accent); }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      letter-spacing: .1px;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .divider {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin: 22px 0 16px;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after  { right: 0; }

    .demo-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      color: #1e40af;
    }
    .demo-box strong { display: block; margin-bottom: 4px; color: #1d4ed8; }
    .demo-creds { font-family: 'SF Mono', 'Consolas', monospace; margin-top: 6px; line-height: 1.7; }

    .signup-link {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }
    .signup-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .signup-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">📊</div>
      <div>
        <div class="brand-name">RefiSight</div>
        <div class="brand-tagline">Refinance Opportunity Platform</div>
      </div>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account to continue</p>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@yourbrokerage.com.au"
               value="{{ request.form.get('email', '') }}" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <div class="remember-row">
        <input type="checkbox" id="remember" name="remember" />
        <label for="remember" style="margin-bottom:0;font-weight:400;">Keep me signed in</label>
      </div>

      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <div class="divider">or try the demo</div>

    <div class="demo-box">
      <strong>Demo account</strong>
      Use these credentials to explore RefiSight:
      <div class="demo-creds">
        📧 demo@refisight.com.au<br>
        🔑 demo1234
      </div>
    </div>

    <div class="signup-link">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Start your free 14-day trial</a>
    </div>
  </div>
</body>
</html>
